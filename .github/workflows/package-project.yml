name: Package Android Studio Project

on:
  push:
    branches:
      - stabilize/core-foundation
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare project
        run: |
          mkdir -p /tmp/package
          rsync -a ./ /tmp/package/             --exclude '.git'             --exclude '.github/workflows/package-project.yml'             --exclude '**/build'             --exclude '.gradle'

      - name: Upload Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: bike-service-app-android-studio
          path: /tmp/package
          include-hidden-files: true
          retention-days: 7
